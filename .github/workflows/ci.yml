name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Build khong can .env.local - da kiem chung: moi bien deu doc luc chay,
      # khong co bien nao bat buoc luc build. Vi vay CI khong can GitHub Secrets.
      - run: npm run build

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      # @openzeppelin va @chainlink duoc resolve qua node_modules
      # (xem remappings trong contracts/foundry.toml), nen phai cai npm
      # truoc khi chay forge.
      - run: npm ci
        working-directory: contracts

      - uses: foundry-rs/foundry-toolchain@v1

      # contracts/lib/ nam trong .gitignore nen forge-std khong co san
      # sau khi checkout, phai cai lai trong CI.
      - run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts

      - run: forge test -vv
        working-directory: contracts
