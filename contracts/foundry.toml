[profile.default]
src = "contracts"
out = "out"
cache_path = "cache-forge"
libs = ["node_modules", "lib"]
test = "test-foundry"

remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@chainlink/=node_modules/@chainlink/",
    "forge-std/=lib/forge-std/src/",
]

evm_version = "cancun"
solc = "0.8.25"
via_ir = true
optimizer = true
optimizer_runs = 200
